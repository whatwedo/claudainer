name: Build and Push Container image to GitHub Container Registry

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 02:00 UTC every day.
    - cron: "0 2 * * *"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build claudainer image (amd64, load locally for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: claudainer:local

      - name: Test claudainer image structure
        run: make test-cst
        env:
          CLAUDAINER_IMAGE: claudainer:local

      - name: Build and push multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/whatwedo/claudainer:latest

  build-and-push-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build proxy image (amd64, load locally for testing)
        uses: docker/build-push-action@v6
        with:
          context: proxy/
          platforms: linux/amd64
          load: true
          tags: claudainer-proxy:local

      - name: Test proxy image structure
        run: make test-cst
        env:
          PROXY_IMAGE: claudainer-proxy:local

      - name: Build and push multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: proxy/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/whatwedo/claudainer-proxy:latest
