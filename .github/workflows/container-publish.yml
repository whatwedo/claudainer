name: Build and Push Container image to GitHub Container Registry

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 02:00 UTC every day.
    - cron: "0 2 * * *"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman and QEMU for multi-arch builds
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-user-static

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Container image (linux/amd64)
        run: |
          podman build --platform linux/amd64 \
            -t ghcr.io/whatwedo/claudainer:latest-amd64 .

      - name: Install container-structure-test
        run: |
          VERSION=v1.22.1
          BASE=https://github.com/GoogleContainerTools/container-structure-test/releases/download/${VERSION}
          curl -fsSL "${BASE}/container-structure-test-linux-amd64" -o container-structure-test
          curl -fsSL "${BASE}/container-structure-test-linux-amd64.sha256" -o container-structure-test.sha256
          echo "$(cat container-structure-test.sha256)  container-structure-test" | sha256sum -c -
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/container-structure-test

      - name: Test claudainer image structure
        run: |
          container-structure-test test \
            --image ghcr.io/whatwedo/claudainer:latest-amd64 \
            --config tests/cst/claudainer.yaml

      - name: Build Container image (linux/arm64 for macOS)
        run: |
          podman build --platform linux/arm64 \
            -t ghcr.io/whatwedo/claudainer:latest-arm64 .

      - name: Push platform images
        run: |
          podman push ghcr.io/whatwedo/claudainer:latest-amd64
          podman push ghcr.io/whatwedo/claudainer:latest-arm64

      - name: Create and push multi-arch manifest
        run: |
          podman manifest create ghcr.io/whatwedo/claudainer:latest
          podman manifest add ghcr.io/whatwedo/claudainer:latest \
            ghcr.io/whatwedo/claudainer:latest-amd64
          podman manifest add ghcr.io/whatwedo/claudainer:latest \
            ghcr.io/whatwedo/claudainer:latest-arm64
          podman manifest push ghcr.io/whatwedo/claudainer:latest

  build-and-push-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman and QEMU for multi-arch builds
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-user-static

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build proxy image (linux/amd64)
        run: |
          podman build --platform linux/amd64 \
            -t ghcr.io/whatwedo/claudainer-proxy:latest-amd64 proxy/

      - name: Install container-structure-test
        run: |
          VERSION=v1.22.1
          BASE=https://github.com/GoogleContainerTools/container-structure-test/releases/download/${VERSION}
          curl -fsSL "${BASE}/container-structure-test-linux-amd64" -o container-structure-test
          curl -fsSL "${BASE}/container-structure-test-linux-amd64.sha256" -o container-structure-test.sha256
          echo "$(cat container-structure-test.sha256)  container-structure-test" | sha256sum -c -
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/container-structure-test

      - name: Test proxy image structure
        run: |
          container-structure-test test \
            --image ghcr.io/whatwedo/claudainer-proxy:latest-amd64 \
            --config tests/cst/proxy.yaml

      - name: Build proxy image (linux/arm64)
        run: |
          podman build --platform linux/arm64 \
            -t ghcr.io/whatwedo/claudainer-proxy:latest-arm64 proxy/

      - name: Push proxy platform images
        run: |
          podman push ghcr.io/whatwedo/claudainer-proxy:latest-amd64
          podman push ghcr.io/whatwedo/claudainer-proxy:latest-arm64

      - name: Create and push proxy multi-arch manifest
        run: |
          podman manifest create ghcr.io/whatwedo/claudainer-proxy:latest
          podman manifest add ghcr.io/whatwedo/claudainer-proxy:latest \
            ghcr.io/whatwedo/claudainer-proxy:latest-amd64
          podman manifest add ghcr.io/whatwedo/claudainer-proxy:latest \
            ghcr.io/whatwedo/claudainer-proxy:latest-arm64
          podman manifest push ghcr.io/whatwedo/claudainer-proxy:latest
